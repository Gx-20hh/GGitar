name: Windows Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-release.yml'

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Unpack bundled dependencies
        shell: pwsh
        run: |
          Expand-Archive third_party/JUCE-9.0.4.zip third_party -Force
          Expand-Archive third_party/NAM-core.zip third_party -Force
      - name: Configure
        run: cmake -S . -B build -A x64 -DGGITAR_BUILD_TESTS=ON
      - name: Build application and feature tests
        run: cmake --build build --config Release --target GGitar GGitarFeatureTests --parallel 2
      - name: Run feature tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          Copy-Item build/GGitar_artefacts/Release/GGitar.exe GGitar.exe
          ./package.ps1
      - name: Preserve build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GGitar-windows-release
          path: |
            发布/*.zip
            发布/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(GGitar VERSION ([0-9.]+)') { throw 'Version not found' }
          $version = $Matches[1]
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; bump the version before publishing again." }
          $assets = @(Get-ChildItem '发布' -File | Where-Object { $_.Extension -eq '.zip' -or $_.Name -eq 'SHA256SUMS.txt' } | ForEach-Object { $_.FullName })
          gh release create $tag @assets --target $env:GITHUB_SHA --title "GGitar $version" --notes-file docs/RELEASE_NOTES.md --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
